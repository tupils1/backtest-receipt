[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backtest-receipt"
version = "0.1.0"
description = "Research discipline layer that makes backtest overfitting detectable."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["backtest", "overfitting", "preregistration", "sharpe", "holdout"]
authors = [{name = "backtest-receipt contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "cryptography>=41",
    "numpy>=1.24",
    "pandas>=2.0",
    "purgedcv>=0.1.11",
    "pyyaml>=6",
    "scipy>=1.10",
]

[project.optional-dependencies]
optuna = ["optuna>=3"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/tupils1/backtest-receipt"
Repository = "https://github.com/tupils1/backtest-receipt"
Issues = "https://github.com/tupils1/backtest-receipt/issues"

[project.scripts]
backtest-receipt = "backtest_receipt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=backtest_receipt --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["backtest_receipt"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backtest_receipt"]
